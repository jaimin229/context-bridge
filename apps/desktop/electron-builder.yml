appId: com.contextbridge.desktop
productName: ContextBridge
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - nsis
    - dir
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ContextBridge
